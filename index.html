<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/favicon.png" type="image/png">
<title>Piggy Dipper test sites</title>
<style>
:root{--bg:#fff6f7;--ink:#2a1d24;--muted:#6b5560;--card:#fff;--line:#f2d5db;--accent:#e8466f}
@media (prefers-color-scheme:dark){:root{--bg:#160e13;--ink:#fdeef0;--muted:#c7aab5;--card:#22161d;--line:#3a2630;--accent:#ff7aa0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(32px + env(safe-area-inset-top)) 16px 48px}
main{max-width:520px;margin:0 auto}
img.logo{width:96px;height:auto;display:block;margin:0 auto 12px;border-radius:50%}
h1{text-align:center;font-size:1.6rem;margin:0 0 4px}
p{text-align:center;color:var(--muted);margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-decoration:none;font-weight:600;font-size:1.1rem}
a::after{content:"→";color:var(--accent)}
a:active{transform:scale(.98)}
</style>
</head>
<body>
<main>
<img class="logo" src="img/logo.png" alt="Piggy Dipper">
<h1>Piggy Dipper test sites</h1>
<p>Not the live site. Forms don't send anything.</p>
<ul>
<li><a href="classic/">Classic</a></li>
<li><a href="neon-night/">Neon Night</a></li>
<li><a href="neon-touch/">Neon Touch</a></li>
<li><a href="thanksgiving/">Thanksgiving</a></li>
<li><a href="pixel-arcade/">Pixel Arcade</a></li>
</ul>
</main>
</body>
</html>
